# Plethora Cloud — production deployment
# Usage: docker compose -f compose.production.yml --env-file .env.production up -d
#
# Prerequisites:
#   - External managed PostgreSQL (Neon) via DATABASE_URL
#   - Cloudflare R2 (or S3-compatible) via S3_* variables
#   - .env.production populated from .env.production.example

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PLETHORA_API_HOST=${PLETHORA_API_HOST}
      - ACME_EMAIL=${ACME_EMAIL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plethora
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${PLETHORA_CLOUD_IMAGE:-ghcr.io/melpomenex/plethora-cloud:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PLETHORA_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
    expose:
      - "3000"
    networks:
      - plethora
    healthcheck:
      # Liveness only — do not query Neon on every interval (preserves autosuspend)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${PLETHORA_CLOUD_IMAGE:-ghcr.io/melpomenex/plethora-cloud:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PLETHORA_ENV=production
      # Migrations use direct/unpooled Neon endpoint when set (see server/src/db/migrate.ts)
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-}
    command: ["node", "dist/db/migrate.js"]
    networks:
      - plethora
    profiles:
      - migrate

  worker:
    image: ${PLETHORA_CLOUD_IMAGE:-ghcr.io/melpomenex/plethora-cloud:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PLETHORA_ENV=production
      - WORKER_CONCURRENCY=2
      - WORKER_POLL_MS=1000
      - NODE_OPTIONS=--max-old-space-size=384
    command: ["node", "dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plethora
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  plethora:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
