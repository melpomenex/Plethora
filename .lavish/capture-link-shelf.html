const focusCover = svgImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#343143"/><g stroke="#7a6b8e" fill="none" stroke-width="2"><circle cx="320" cy="180" r="129"/><circle cx="320" cy="180" r="91"/><circle cx="320" cy="180" r="54"/></g><circle cx="320" cy="180" r="15" fill="#e3b39c"/><path d="M90 180h120m220 0h120M320 40v30m0 220v30" stroke="#bc98b4" stroke-width="2"/></svg>`);

 {id:'recall',title:'Why forgetting is part of learning',domain:'learning.example',type:'Article',time:'2m ago',date:'2026-10-14T10:00:00Z',cover:curveCover,summary:'A sample saved article about memory, retrieval, and returning to an idea at the right moment.'},

function notify(message){const el=document.getElementById('notice');el.textContent=message;el.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{el.hidden=true;},4500);}
function tile(item){return `<li class="tile"><button class="main-action" data-open="${item.id}" aria-label="Open ${escape(item.title)} in Plethora"><div class="media">${item.cover?`<img class="cover" src="${item.cover}" alt="" loading="lazy" decoding="async" width="640" height="360">`:`<div class="fallback" aria-hidden="true">${icon('book')}<span class="fallback-host">${item.domain}</span></div>`}<span class="type-label">${icon(item.type==='Video'?'play':'book')}${item.type}</span></div><div class="info"><h4 title="${escape(item.title)}">${escape(item.title)}</h4><div class="byline"><span class="domain">${item.domain}</span><time datetime="${item.date}" title="${new Date(item.date).toUTCString()}">${item.time}</time></div></div></button><div class="footer"><span class="read-hint" aria-hidden="true">Read in Plethora ${icon('arrow')}</span><button class="original" data-original="${item.id}" aria-label="Open original page for ${escape(item.title)}">Original ${icon('external')}</button></div></li>`;}
function analytics(){return `<div class="analytics"><div class="analytics-top"><strong>Last 30 days</strong><div class="report"><span>235 captured</span><svg class="sparkline" viewBox="0 0 110 24" role="img" aria-label="Illustrative capture activity for the last 30 days"><path d="M1 22h108" stroke="currentColor" opacity=".3"/><path d="M2 21V18m4 3V16m4 5V19m4 2V10m4 11V15m4 6V17m4 4V13m4 8V5m4 16V12m4 9V17m4 4V13m4 8V18m4 3V20m4 1V13m4 8V8m4 13V15m4 6V10m4 11V17m4 4V4m4 17V9m4 12V15m4 6V7m4 14V11m4 10V18m4 3V15m4 6V12m4 9V16" stroke="currentColor" stroke-width="2"/></svg></div></div><div class="counts"><span><strong>11</strong>Browser Extension</span><span><strong>223</strong>Share Target</span><span><strong>0</strong>RSS</span><span><strong>1</strong>Manual & local imports</span></div></div>`;}
function shelf(){const state=document.getElementById('state').value;if(state==='loading')return `<ul class="tiles" aria-busy="true" aria-label="Loading browser saves">${Array.from({length:6},()=>'<li class="tile skeleton"><div class="skeleton-media"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div></li>').join('')}</ul>`;if(state==='empty')return `<div class="state-panel">${icon('tray')}<div><h4>Your browser saves will appear here</h4><p>Save a page with the Plethora extension, then come back to read it.</p></div></div>`;if(state==='error')return `<div class="state-panel">${icon('warning')}<div><h4>We couldn’t load your browser saves</h4><p>Your saved links are still in the library. Try loading them again.</p><button class="text-button" data-retry>${icon('refresh')}Try again</button></div></div>`;return `${state==='stale'?`<div class="stale-notice">${icon('warning')}Couldn’t refresh. Showing your last loaded saves.<button class="text-button" data-retry>Retry ${icon('refresh')}</button></div>`:''}<ul class="tiles">${saves.map(tile).join('')}</ul>`;}
function dashboard(){screen='dashboard';canvas.innerHTML=`<div class="welcome"><h1>Welcome back</h1><p class="muted">Your reading and review, in one place.</p></div><section class="continue" aria-label="Continue Reading"><p class="continue-title">Continue Reading</p><div class="continue-item">${icon('book')}<div><strong>How ideas become connected</strong><p class="muted">40% complete</p></div><button class="text-button" data-open="ideas">Resume ${icon('arrow')}</button></div></section><section class="capture" aria-labelledby="capture-title"><div class="capture-header">${icon('browser')}<h2 id="capture-title">Capture Activity</h2></div><div class="shelf-header"><div><h3>Recently saved from your browser</h3><p>A good idea is only one click away.</p></div><button class="text-button" data-nav="library">View all browser saves ${icon('arrow')}</button></div>${shelf()}${analytics()}</section><section class="progress-context" aria-label="Your progress"><div><strong>Your Progress</strong><p>Keep your reading moving</p></div><div><strong>322</strong><p>Documents</p></div><div><strong>1</strong><p>Due today</p></div><div><strong>25</strong><p>Cards learned</p></div></section><p class="explanation">Concept preview using Plethora’s theme roles and Golden Hour palette. Hover or focus a save, open it, or try the original-page action. Change the state above to inspect recovery. Resize to see the phone list. Titles, domains, covers, and counts are illustrative; no real capture data is loaded.</p>`;}
function library(filtered=true){screen='library';canvas.innerHTML=`<div class="screen-header"><h1>Library</h1><button class="text-button" data-nav="dashboard">${icon('back')}Back to Dashboard</button></div><div class="filter-row">${filtered?`<button class="filter-chip" id="clear-source" aria-label="Remove Browser Extension source filter">Browser Extension ${icon('close')}</button>`:''}<span class="scope">All library · Newest saved first</span></div><p class="muted" style="margin-bottom:20px">${filtered?'Your browser saves, across every collection.':'Source filter removed. This preview keeps its all-library scope.'}</p><ul class="library-list">${saves.map(item=>`<li class="library-row">${icon(item.type==='Video'?'play':'book')}<button data-open="${item.id}"><strong>${escape(item.title)}</strong><p>${item.domain} · ${item.type} · ${item.time}</p></button><button class="original" data-original="${item.id}">Original ${icon('external')}</button></li>`).join('')}</ul><p class="explanation">Simulated Library destination. The source filter is explicit and removable, and the scope stays visible. Production will include all matching library records with backend pagination.</p>`;}
function reader(id){const item=saves.find(item=>item.id===id);if(!item)return;screen='reader';canvas.innerHTML=`<div class="screen-header"><h1>Saved document</h1><button class="text-button" data-nav="dashboard">${icon('back')}Back to Dashboard</button></div><article class="reader"><h2>${escape(item.title)}</h2><span class="muted">${item.domain} · Saved ${item.time}</span><p>${item.summary}</p><p class="sample-copy">This is a simulated saved-document destination. In the app, this action opens the existing reader for the persisted library document and reuses its tab.</p><button class="text-button" data-original="${item.id}">Open original ${icon('external')}</button></article>`;notify('Concept: opened the saved document in Plethora.');}
document.addEventListener('click',event=>{const open=event.target.closest('[data-open]');if(open){reader(open.dataset.open);return;}const original=event.target.closest('[data-original]');if(original){const item=saves.find(item=>item.id===original.dataset.original);notify(`Concept: open the original page on ${item.domain} in your browser.`);return;}const nav=event.target.closest('[data-nav]');if(nav){nav.dataset.nav==='library'?library():dashboard();return;}if(event.target.closest('[data-retry]')){document.getElementById('state').value='ready';dashboard();notify('Concept: browser saves loaded successfully.');}if(event.target.closest('#clear-source'))library(false);});
document.getElementById('theme').addEventListener('change',event=>{document.documentElement.dataset.theme=event.target.value;});
document.getElementById('state').addEventListener('change',()=>dashboard());
dashboard();
</script>
</body>
</html>
