name: Plethora Cloud Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'compose.production.yml'
      - 'deploy/**'
      - '.github/workflows/cloud-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'compose.production.yml'
      - 'deploy/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: melpomenex/plethora-cloud

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run tests
        run: npm test

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose
        run: chmod +x scripts/validate-production-compose.sh && ./scripts/validate-production-compose.sh

  build-and-push:
    needs: [test, validate-compose]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/cloud-v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build image locally for smoke test
        run: docker build -t plethora-cloud:smoke -f server/Dockerfile .

      - name: Smoke test — missing config fails fast
        run: |
          docker run --rm \
            -e PLETHORA_ENV=production \
            -e DATABASE_URL=postgresql://u:p@host/db \
            plethora-cloud:smoke \
            node -e "
              process.env.JWT_SECRET='short';
              import('./dist/config/env.js').then(m => {
                const errs = m.validateProductionConfig(m.loadConfig());
                if (errs.length === 0) process.exit(1);
                process.exit(0);
              });
            "
