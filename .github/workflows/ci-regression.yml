name: CI Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fail on unresolved merge conflicts
        run: |
          set -e
          # Look for git merge-conflict markers in tracked source files.
          # Skips generated/dependency dirs. Fails on the first match so that
          # accidental commits of an unresolved conflict never reach main.
          # Pattern: `<<<<<<< ` / `>>>>>>> ` start a marker line (with anything
          # after); `=======` is the separator (git emits exactly 7 `=`).
          hits=$(git grep -lnE '^(<<<<<<< |>>>>>>> )|^=======$' -- \
            ':!node_modules' ':!dist' ':!src-tauri/target' ':!src-tauri/gen' \
            ':!**/package-lock.json' ':!**/Cargo.lock' \
            2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Unresolved merge-conflict markers found in:"
            echo "$hits"
            exit 1
          fi
          echo "No merge-conflict markers detected."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libpipewire-0.3-dev libgbm-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib -- --test-threads=1
        env:
          RUST_MIN_STACK: 33554432

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check
        env:
          RUST_MIN_STACK: 33554432

  bundle-size:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libpipewire-0.3-dev libgbm-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend for bundle size check
        run: npm run build || npx vite build
        env:
          INCREMENTUM_TAURI: "1"

      - name: Check bundle size
        run: |
          TOTAL=$(find dist -name '*.js' -exec cat {} + 2>/dev/null | wc -c)
          echo "Total JS bundle size: ${TOTAL} bytes"
          THRESHOLD=2500000  # 2.5MB
          if [ "$TOTAL" -gt "$THRESHOLD" ]; then
            echo "::warning::Bundle size ${TOTAL} bytes exceeds threshold ${THRESHOLD}"
          else
            echo "Bundle size ${TOTAL} bytes is within threshold ${THRESHOLD}"
          fi

  performance:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Run benchmark suites
        run: npm run bench

      # Enforcing mode: fails the workflow when any benchmarked hot path
      # regresses past its baseline tolerance (baselines + per-benchmark
      # tolerances recorded from main CI runs — see scripts/perf-baselines.json).
      - name: Check performance budget
        run: node scripts/check-perf-budget.mjs

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: .bench/results.json
          if-no-files-found: error

  memory:
    # Non-blocking diagnostic (design D9): shared-runner memory is too
    # environment-dependent to gate on, so this job records the numbers and
    # uploads them as artifacts. It is `continue-on-error`, is not a required
    # check, and nothing depends on it — the blocking `performance` job above
    # is unchanged.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Install WebKitGTK and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the app (debug)
        run: npm run tauri:build:local:debug

      - name: Provision the corpus
        run: node scripts/memory-bench/driver.js --provision

      - name: Run the memory scenario under Xvfb
        run: xvfb-run -a node scripts/memory-bench/driver.js --output .bench/memory-result.json

      # Warn-only: regressions are visible in the log and the evaluation
      # record below, but a mismatch against the baseline profile or an
      # unreliable run exits 2 and the job's continue-on-error keeps the
      # workflow green while the artifact shows what happened.
      - name: Check memory budget (warn-only)
        run: node scripts/check-memory-budget.mjs --warn-only

      - name: Upload memory result and evaluation record
        uses: actions/upload-artifact@v4
        with:
          name: memory-result
          path: |
            .bench/memory-result.json
            .bench/memory-evaluation.json
          if-no-files-found: warn

  visual:
    # PDF reflow visual regression (change add-pdf-reflow, task 10.2).
    # Warn-only until baselines stabilize across CI runners (same posture
    # the perf gate used); failures never block the pipeline here.
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression (warn-only)
        run: npm run test:visual

      - name: Upload visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: .playwright/results
          retention-days: 7
