name: Mobile Build Plethora

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the signed, validated .ipa to TestFlight (requires ASC API-key secrets)"
        type: boolean
        default: false
      release_tag:
        description: "Existing GitHub release tag to attach the signed APK to (e.g. v3.0.0)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: true

env:
  NODE_VERSION: "lts/*"
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  android-build:
    name: Android build (Tauri)
    runs-on: ubuntu-latest
    # The cold build is Rust (~26m) + Gradle APK assembly (Kotlin compile, R8
    # minify, dex, package, sign) which together exceed 45m. The Rust half is
    # cached on subsequent runs, but a cold run needs the headroom.
    timeout-minutes: 75
    env:
      SKIP_NOTEBOOKLM_SIDECAR: "1"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify target release exists
        if: inputs.release_tag != '' && inputs.release_tag != null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          echo "Verifying existing GitHub release for tag '$TAG'..."
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Target GitHub release '$TAG' does not exist. The workflow will not create tags or releases."
            exit 1
          fi
          echo "GitHub release '$TAG' verified."

      - name: Add swap and stop oomd (Linux)
        run: |
          # Compiling the final plethora-tauri lib needs more memory than the
          # 16 GB runner provides; when RAM+swap ran out, the kernel/oomd took
          # the runner agent down mid-compile ("runner received a shutdown
          # signal"). A 16 GB swapfile plus stopping systemd-oomd (which kills
          # the whole user slice on memory-pressure spikes) turns the hard
          # failure into a slower-but-successful compile.
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          free -m

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android

      - name: Ensure Cargo is on PATH
        run: |
          set -euo pipefail
          # Resolve the *real* cargo binary, not the rustup shim.
          #
          # Gradle's BuildTask.kt reads $CARGO (resolveCargoExecutable) and runs
          # it via project.exec. The default `cargo` on PATH is a rustup shim
          # (~/.cargo/bin/cargo -> rustup) that re-execs rustup. On the GitHub
          # hosted runner that shim intermittently fails to start from inside
          # Gradle's project.exec with:
          #   "A problem occurred starting process 'command '.../cargo''"
          # even though running the shim by hand works. Pointing $CARGO at the
          # concrete binary the toolchain actually installed (the one rustup
          # proxies to) sidesteps the shim entirely and makes the spawn reliable.
          SHIM="$(command -v cargo || true)"
          REAL_CARGO=""
          # 1) `rustup which cargo` prints the exact binary rustup proxies to.
          if command -v rustup >/dev/null 2>&1; then
            REAL_CARGO="$(rustup which cargo 2>/dev/null | tail -1 || true)"
          fi
          # 2) Fall back to globbing the rustup toolchains dir.
          if [ -z "$REAL_CARGO" ] || [ ! -x "$REAL_CARGO" ]; then
            REAL_CARGO="$(find "$HOME/.rustup/toolchains" -path '*/bin/cargo' -type f 2>/dev/null | sort -V | tail -1 || true)"
          fi
          # 3) Fall back to the toolcache layout some setup actions use.
          if { [ -z "$REAL_CARGO" ] || [ ! -x "$REAL_CARGO" ]; } && [ -d /opt/hostedtoolcache/Rust ]; then
            REAL_CARGO="$(find /opt/hostedtoolcache/Rust -path '*/bin/cargo' -type f 2>/dev/null | sort -V | tail -1 || true)"
          fi
          # 4) Last resort: the shim itself.
          if [ -z "$REAL_CARGO" ] || [ ! -x "$REAL_CARGO" ]; then
            REAL_CARGO="$SHIM"
          fi
          if [ -z "$REAL_CARGO" ] || [ ! -x "$REAL_CARGO" ]; then
            echo "::error::cargo not found after rust-toolchain setup."
            exit 1
          fi

          CARGO_BIN_DIR="$(dirname "$REAL_CARGO")"
          # Prepend the real bin dir so any PATH lookup also hits the concrete tools.
          echo "$CARGO_BIN_DIR" >> "$GITHUB_PATH"
          echo "CARGO=$REAL_CARGO" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=${RUST_TOOLCHAIN}" >> "$GITHUB_ENV"
          echo "Resolved real cargo: $REAL_CARGO"
          ls -l "$REAL_CARGO"
          "$REAL_CARGO" --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        # Retry npm ci up to 3 times. The onnxruntime-node postinstall script
        # downloads a native binary from api.nuget.org and intermittently hits
        # ETIMEDOUT on GitHub runners, which aborts the whole Android build.
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "::warning::npm ci attempt $i failed, retrying..."
            [ "$i" -lt 3 ] || exit 1
            sleep 10
          done

      - name: Build frontend assets
        run: npm run build

      - name: Install Tauri mobile CLI helper
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Ensure Android mobile scaffold exists
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "::notice::Android scaffold missing. Initializing via 'npm run tauri -- android init --ci'."
            npm run tauri -- android init --ci
          fi

          if [ ! -d "src-tauri/gen/android" ]; then
            echo "::error::Android scaffold is still missing after init."
            exit 1
          fi

      - name: Allow localhost cleartext traffic on Android
        run: |
          set -euo pipefail
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          XML_DIR="src-tauri/gen/android/app/src/main/res/xml"
          NETSEC="$XML_DIR/network_security_config.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found at $MANIFEST"
            exit 1
          fi

          mkdir -p "$XML_DIR"
          cat > "$NETSEC" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="false">localhost</domain>
            </domain-config>
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="false">127.0.0.1</domain>
            </domain-config>
          </network-security-config>
          EOF

          if ! grep -q 'android:usesCleartextTraffic=' "$MANIFEST"; then
            sed -i 's#<application #<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" #' "$MANIFEST"
          else
            sed -i 's#android:usesCleartextTraffic="[^"]*"#android:usesCleartextTraffic="true"#g' "$MANIFEST"
            if ! grep -q 'android:networkSecurityConfig=' "$MANIFEST"; then
              sed -i 's#<application #<application android:networkSecurityConfig="@xml/network_security_config" #' "$MANIFEST"
            fi
          fi

          echo "Patched Android manifest for localhost cleartext:"
          grep -nE "usesCleartextTraffic|networkSecurityConfig|<application" "$MANIFEST" || true

      - name: Decide Android signing mode (signed vs unsigned)
        id: android_mode
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "mode=provided-keystore" >> "$GITHUB_OUTPUT"
            echo "All Android signing prerequisites detected. Producing signed APK with provided keystore."
          else
            echo "mode=self-signed" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets missing. Generating ephemeral self-signed keystore for APK signing."
          fi

      - name: Configure Android C toolchain env for cargo build scripts
        run: |
          set -euo pipefail
          if [ -n "${NDK_HOME:-}" ] && [ -d "${NDK_HOME}" ]; then
            NDK_ROOT="${NDK_HOME}"
          else
            NDK_ROOT="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          if [ -z "${NDK_ROOT:-}" ] || [ ! -d "${NDK_ROOT}" ]; then
            echo "::error::Android NDK root could not be determined."
            exit 1
          fi

          NDK_BIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_AARCH64="${NDK_BIN}/aarch64-linux-android24-clang"
          AR_LLVM="${NDK_BIN}/llvm-ar"

          if [ ! -x "$CC_AARCH64" ]; then
            echo "::error::Expected Android clang not found: $CC_AARCH64"
            exit 1
          fi
          if [ ! -x "$AR_LLVM" ]; then
            echo "::error::Expected Android archiver not found: $AR_LLVM"
            exit 1
          fi

          {
            echo "NDK_HOME=$NDK_ROOT"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC_AARCH64"
            echo "CC_aarch64_linux_android=$CC_AARCH64"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$AR_LLVM"
            echo "AR_aarch64_linux_android=$AR_LLVM"
          } >> "$GITHUB_ENV"

      - name: Build Android APK (arm64)
        env:
          # Bound memory: the heavy Rust release build (LTO, codegen-units=1)
          # runs alongside Gradle's JVM. Disabling the Gradle daemon and capping
          # the Kotlin daemon heap keeps memory usage bounded on the 7GB runner.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx1g"
          # Serialize cargo jobs so the linker/LTO pass doesn't compound memory
          # pressure on top of Gradle's JVM.
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "off"
        run: |
          set -o pipefail
          mkdir -p artifacts/mobile-logs
          # Ensure cargo is accessible for Gradle's rustBuild task (BuildTask.kt
          # resolves cargo via $CARGO, set above to the real toolchain binary).
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "Using cargo: $CARGO"
          "$CARGO" --version
          # --features custom-protocol: serve the bundled frontendDist via the
          # tauri:// protocol instead of the localhost plugin. On mobile the
          # WebView can't reach tauri-plugin-localhost's loopback server, so we
          # must use the custom protocol + bundled assets. (tauri-plugin-localhost
          # is a desktop-only dependency; see Cargo.toml.) The tauri CLI passes
          # its --features through to the cargo build it runs.
          npm run tauri -- android build --ci --target aarch64 --apk --features custom-protocol 2>&1 | tee artifacts/mobile-logs/android-build.log

      - name: Sign Android APK (release)
        if: steps.android_mode.outputs.mode == 'provided-keystore' || steps.android_mode.outputs.mode == 'self-signed'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-signing
          if [ "${{ steps.android_mode.outputs.mode }}" = "provided-keystore" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > artifacts/android-signing/release.keystore
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            KS_PASS="plethora-ci"
            KEY_ALIAS="plethora-ci"
            KEY_PASS="plethora-ci"
            keytool -genkeypair \
              -v \
              -keystore artifacts/android-signing/release.keystore \
              -storepass "$KS_PASS" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Plethora CI"
          fi

          APK_TO_SIGN="$(find src-tauri/gen/android -type f -name '*release-unsigned.apk' | head -1 || true)"
          if [ -z "$APK_TO_SIGN" ]; then
            APK_TO_SIGN="$(find src-tauri/gen/android -type f -name '*release*.apk' ! -name '*signed*' ! -name '*aligned*' | head -1 || true)"
          fi
          if [ -z "$APK_TO_SIGN" ]; then
            echo "::error::No release APK found to sign."
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android build-tools not found."
            exit 1
          fi

          "${BUILD_TOOLS_DIR}/zipalign" -p -f 4 "$APK_TO_SIGN" artifacts/android-signing/app-release-aligned.apk
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks artifacts/android-signing/release.keystore \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out artifacts/android-signing/plethora-android-arm64-signed.apk \
            artifacts/android-signing/app-release-aligned.apk
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose artifacts/android-signing/plethora-android-arm64-signed.apk

      - name: Collect Android output summary
        if: always()
        run: |
          mkdir -p artifacts/mobile-logs
          {
            echo "=== Android outputs under src-tauri/gen/android/app/build/outputs ==="
            find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | head -200
            echo
            echo "=== Android-related target outputs under src-tauri/target ==="
            find src-tauri/target -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | head -200
            echo
            echo "=== Android signed outputs ==="
            find artifacts/android-signing -type f 2>/dev/null | head -200
          } | tee artifacts/mobile-logs/android-outputs.txt

      - name: Upload Android artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plethora-android
          path: |
            src-tauri/gen/android/app/build/outputs/**
            src-tauri/target/**/*.apk
            src-tauri/target/**/*.aab
            artifacts/android-signing/*.apk
            artifacts/mobile-logs/android-build.log
            artifacts/mobile-logs/android-outputs.txt
          if-no-files-found: warn

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/') && (inputs.release_tag == '' || inputs.release_tag == null)
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            const version = context.ref.replace('refs/tags/', '');
            core.setOutput('VERSION', version);

      - name: Upload Android signed artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && (inputs.release_tag == '' || inputs.release_tag == null)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-signing/plethora-android-arm64-signed.apk
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}

      - name: Attach signed APK to existing GitHub Release
        if: inputs.release_tag != '' && inputs.release_tag != null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          APK="artifacts/android-signing/plethora-android-arm64-signed.apk"

          echo "Verifying target GitHub release '$TAG' exists before upload..."
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::GitHub release '$TAG' does not exist. Aborting upload (will not create release or tag)."
            exit 1
          fi

          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found at $APK"
            exit 1
          fi

          echo "Attaching signed APK to existing release '$TAG' with --clobber..."
          gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
          echo "Successfully uploaded $APK to release '$TAG'."

  ios-build:
    name: iOS build validation (Tauri)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SKIP_NOTEBOOKLM_SIDECAR: "1"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Ensure Cargo is on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Tauri mobile CLI helper
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Ensure iOS mobile scaffold exists
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "::notice::iOS scaffold missing. Initializing via 'npm run tauri -- ios init --ci'."
            npm run tauri -- ios init --ci
          fi

          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "::error::iOS scaffold is still missing after init."
            exit 1
          fi

      # gen/apple is committed; this re-applies the idempotent overrides
      # (display name, icons, privacy manifest/purpose strings, share-extension
      # target) so an ephemeral init or a drifted checkout is corrected.
      - name: Apply iOS project overrides (idempotent)
        run: node scripts/apply-ios-project-overrides.js

      - name: Decide iOS build mode (signed vs simulator)
        id: ios_mode
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for v in IOS_CERT_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64 IOS_SIGNING_IDENTITY IOS_TEAM_ID; do
            if [ -z "${!v}" ]; then
              missing=1
            fi
          done

          is_release_ref=0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            is_release_ref=1
          fi

          if [ "$missing" -eq 0 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "All signing prerequisites detected. Running signed iOS archive + export + validation."
          else
            # Release-ref builds MUST be signed (Change A task 5.1): a tag that
            # cannot produce a signed artifact fails the job instead of quietly
            # shipping a simulator build.
            if [ "$is_release_ref" -eq 1 ]; then
              echo "::error::Refusing unsigned build on release ref $GITHUB_REF. Required secrets: IOS_CERT_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_SIGNING_IDENTITY, IOS_TEAM_ID."
              exit 1
            fi
            echo "mode=simulator" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing prerequisites are missing. Running simulator build validation instead (non-release ref)."
            echo "Physical iPhone install requires Apple signing credentials (IOS_CERT_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_SIGNING_IDENTITY, IOS_TEAM_ID)."
          fi

      - name: Import iOS signing certificate and provisioning profiles
        if: steps.ios_mode.outputs.mode == 'signed'
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/ios_signing_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$IOS_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          install_profile() {
            local profile="$1"
            local uuid
            uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          }
          install_profile "$PROFILE_PATH"
          # Optional Share Extension profile (Change E target ships in the
          # archive; manual-signing exports need a profile for its bundle id).
          SHARE_PROFILE_PATH=""
          if [ -n "${IOS_SHARE_PROFILE_BASE64:-}" ]; then
            SHARE_PROFILE_PATH="$RUNNER_TEMP/ios_share_profile.mobileprovision"
            echo "$IOS_SHARE_PROFILE_BASE64" | base64 --decode > "$SHARE_PROFILE_PATH"
            install_profile "$SHARE_PROFILE_PATH"
          fi

          echo "APPLE_SIGNING_IDENTITY=$IOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$IOS_TEAM_ID" >> "$GITHUB_ENV"
          # Consumed by the exportOptions generation step.
          APP_PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)"
          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          if [ -n "$SHARE_PROFILE_PATH" ]; then
            SHARE_PROFILE_NAME="$(security cms -D -i "$SHARE_PROFILE_PATH" | plutil -extract Name raw -)"
            echo "SHARE_PROFILE_NAME=$SHARE_PROFILE_NAME" >> "$GITHUB_ENV"
          fi

      # Manual-signing exportOptions for xcodebuild -exportArchive (the same
      # shape as src-tauri/gen/apple/secrets/exportOptions.plist.example).
      - name: Generate exportOptions plist (signed)
        if: steps.ios_mode.outputs.mode == 'signed'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/exportOptions.plist"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '    <key>method</key><string>app-store-connect</string>'
            echo "    <key>teamID</key><string>$IOS_TEAM_ID</string>"
            echo '    <key>signingStyle</key><string>manual</string>'
            echo '    <key>signingCertificate</key><string>Apple Distribution</string>'
            echo '    <key>stripSwiftSymbols</key><true/>'
            echo '    <key>uploadSymbols</key><true/>'
            echo '    <key>provisioningProfiles</key><dict>'
            echo "        <key>com.plethora.app</key><string>${APP_PROFILE_NAME}</string>"
            if [ -n "${SHARE_PROFILE_NAME:-}" ]; then
              echo "        <key>com.plethora.app.ShareExtension</key><string>${SHARE_PROFILE_NAME}</string>"
            fi
            echo '    </dict>'
            echo '</dict></plist>'
          } > "$PLIST"
          plutil -lint "$PLIST"
          echo "EXPORT_OPTIONS_PLIST=$PLIST" >> "$GITHUB_ENV"

      - name: Build + archive iOS app (signed Release)
        if: steps.ios_mode.outputs.mode == 'signed'
        env:
          PLETHORA_BUILD_PROFILE: store
        run: |
          set -euo pipefail
          node scripts/ios-release.mjs archive -- \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual

      - name: Build iOS app (simulator fallback, non-release refs only)
        if: steps.ios_mode.outputs.mode == 'simulator'
        run: |
          set -o pipefail
          mkdir -p artifacts/mobile-logs
          npm run tauri -- ios build --ci --target aarch64-sim 2>&1 | tee artifacts/mobile-logs/ios-build.log

      # Task 5.1/5.2: validate before any upload; validation failure keeps the
      # job red and skips every later upload step.
      - name: Validate .ipa with App Store Connect
        if: steps.ios_mode.outputs.mode == 'signed'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PDF_BASE64: ${{ secrets.ASC_KEY_PDF_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-validation-logs
          node scripts/ios-release.mjs validate 2>&1 | tee artifacts/ios-validation-logs/altool-validate.log

      - name: Detect TestFlight upload eligibility (ASC API key present?)
        id: asc_mode
        if: steps.ios_mode.outputs.mode == 'signed'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PDF_BASE64: ${{ secrets.ASC_KEY_PDF_BASE64 }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_PDF_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ASC API key detected."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC_API-key secrets absent — skipping TestFlight upload (set ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_PDF_BASE64 to enable)."
          fi

      - name: Upload to TestFlight
        if: >-
          steps.ios_mode.outputs.mode == 'signed' &&
          steps.asc_mode.outputs.present == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.upload_testflight == true)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PDF_BASE64: ${{ secrets.ASC_KEY_PDF_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-validation-logs
          node scripts/ios-release.mjs upload 2>&1 | tee artifacts/ios-validation-logs/altool-upload.log

      - name: Collect iOS output summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/mobile-logs artifacts/ios-export artifacts/ios-archive
          {
            echo "=== Archives ==="
            find src-tauri/gen/apple/build src-tauri/target/xcodebuild -maxdepth 3 \( -name "*.xcarchive" \) 2>/dev/null || true
            echo
            echo "=== IPAs ==="
            find src-tauri/gen/apple/build src-tauri/target/xcodebuild src-tauri/target -type f -name "*.ipa" 2>/dev/null || true
          } | tee artifacts/mobile-logs/ios-outputs.txt

          # Stage named artifacts for the upload steps below.
          ARCHIVE="$(find src-tauri/gen/apple/build src-tauri/target/xcodebuild -maxdepth 3 -name "*.xcarchive" 2>/dev/null | head -1 || true)"
          IPA="$(find src-tauri/gen/apple/build src-tauri/target/xcodebuild src-tauri/target -type f -name "*.ipa" 2>/dev/null | head -1 || true)"
          if [ -n "$ARCHIVE" ]; then
            ditto -c -k --keepParent "$ARCHIVE" "artifacts/ios-archive/$(basename "$ARCHIVE").zip"
          fi
          if [ -n "$IPA" ]; then
            cp "$IPA" artifacts/ios-export/
          fi
          # dSYMs ride along with the ipa staging when present.
          find src-tauri/gen/apple/build src-tauri/target/xcodebuild -type d -name "*.dSYM" 2>/dev/null | while read -r dsym; do
            ditto -c -k --keepParent "$dsym" "artifacts/ios-archive/$(basename "$dsym").zip" || true
          done || true

      - name: Upload ios-archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: artifacts/ios-archive/
          if-no-files-found: warn

      - name: Upload ios-ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios-export/*.ipa
          if-no-files-found: warn

      - name: Upload ios-validation-logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-logs
          path: |
            artifacts/ios-validation-logs/**
            artifacts/mobile-logs/ios-build.log
            artifacts/mobile-logs/ios-outputs.txt
          if-no-files-found: warn

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/') && (inputs.release_tag == '' || inputs.release_tag == null)
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            const version = context.ref.replace('refs/tags/', '');
            core.setOutput('VERSION', version);

      - name: Upload iOS signed artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.ios_mode.outputs.mode == 'signed' && (inputs.release_tag == '' || inputs.release_tag == null)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ios-export/*.ipa
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}

# Mobile CI prerequisites — iOS (Change A tasks 5.1–5.4; full protocol in
# docs/release/ios-signing.md, end-to-end walkthrough in
# docs/release/ios-reproducible-build.md):
# - IOS_CERT_BASE64:            Base64-encoded Apple Distribution signing certificate (.p12)
# - IOS_CERT_PASSWORD:          Password for that .p12
# - IOS_PROFILE_BASE64:         Base64-encoded App Store provisioning profile (.mobileprovision) for com.plethora.app
# - IOS_SHARE_PROFILE_BASE64:   (optional) Base64-encoded profile for com.plethora.app.ShareExtension —
#                               required for manual-signing exports now that the share-extension target ships
# - IOS_SIGNING_IDENTITY:       Signing identity name (e.g. "Apple Distribution: …")
# - IOS_TEAM_ID:                Apple Developer team ID
# - ASC_KEY_ID:                 App Store Connect API key ID (enables validation + TestFlight upload)
# - ASC_ISSUER_ID:              App Store Connect API issuer ID
# - ASC_KEY_PDF_BASE64:         Base64 of the API key's .p8 private file (legacy env name kept for contract compat)
#
# Behavior matrix:
# - Secrets present  → signed archive + export + altool validation; artifacts ios-archive / ios-ipa / ios-validation-logs.
# - Secrets absent   → simulator build allowed ONLY on non-release refs; tag builds fail hard.
# - ASC secrets present AND (v* tag OR dispatch input upload_testflight) → upload to TestFlight after successful validation.
#
# Android signing secrets (unchanged):
# - ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#
# Uploaded artifacts:
# - Android: plethora-android (Gradle outputs, signed APK, build logs)
# - iOS:     ios-archive (.xcarchive + dSYM zips) · ios-ipa (.ipa) ·
#            ios-validation-logs (altool validate/upload logs, build log, outputs summary)
# Artifact names are consumed by Proposal G's evidence schema (G owns final naming).
