name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag to build, e.g. v1.21.12'
        required: true
        type: string
      build_ref:
        description: 'Commit/branch to build (defaults to version_tag). Use to backfill a release asset with a fix that landed after the tag — the built tree must still carry the version matching version_tag.'
        required: false
        type: string
        default: ''
      windows_only:
        description: 'Run only the windows-x86_64 job; skip all other platform/manifest jobs. Used to add the Windows installer to an existing release without touching its other assets.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      # windows_only dispatch (release backfill) collapses the matrix to the
      # Windows leg only, so an existing release gains its installer without
      # rebuilding/re-uploading (and re-signing) every other platform's assets.
      # The matrix context is NOT available in a job-level `if`, so the leg
      # filter has to live here in the matrix expression itself.
      # macOS note: `app` bundle is required so the updater emits
      # Plethora_<v>_aarch64.app.tar.gz (and its .sig) alongside the dmg;
      # the updater only consumes the .app.tar.gz, not the .dmg.
      matrix:
        ${{ (github.event_name == 'workflow_dispatch' && inputs.windows_only == true
            && fromJSON('{"include":[{"id":"windows-x86_64","platform":"windows-latest","os":"windows","arch":"x86_64","tauri_args":"--bundles nsis","required":false}]}'))
            || fromJSON('{"include":[{"id":"macos-aarch64","platform":"macos-latest","os":"macos","arch":"aarch64","tauri_args":"--bundles app,dmg","required":true},{"id":"windows-x86_64","platform":"windows-latest","os":"windows","arch":"x86_64","tauri_args":"--bundles nsis","required":false},{"id":"linux-x86_64","platform":"ubuntu-latest","os":"linux","arch":"x86_64","tauri_args":"--bundles deb","required":true},{"id":"linux-aarch64","platform":"ubuntu-24.04-arm","os":"linux","arch":"aarch64","tauri_args":"--bundles deb","required":false}]}') }}

    runs-on: ${{ matrix.platform }}
    # Job-level env so EVERY step sees these — critically the `prebuild`
    # hook (npm run build → prebuild → node scripts/download-sidecars.js) and
    # the "Build sidecar binaries" step run BEFORE the "Build Tauri application"
    # step. When these were only set on the Tauri step, download-sidecars took
    # its `!bundleRuntime` early-exit on Windows and never created the
    # pocket-tts / notebooklm .exe sidecars, so the bundler failed with
    # "resource path `bin\pocket-tts-x86_64-pc-windows-msvc.exe` doesn't exist".
    env:
      NOTEBOOKLM_BUNDLE_RUNTIME: "1"
      POCKET_TTS_BUNDLE_RUNTIME: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Dispatch builds default to the tag itself; build_ref lets a fix
          # that landed after the tag be built into the same release.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_ref || inputs.version_tag) || github.ref }}
          submodules: recursive

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Increase Rust stack size (Unix)
        if: matrix.os != 'windows'
        run: echo "RUST_MIN_STACK=33554432" >> $GITHUB_ENV

      - name: Increase Rust stack size (Windows)
        if: matrix.os == 'windows'
        run: echo "RUST_MIN_STACK=33554432" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        # Retry npm ci to ride out transient npm-registry connectivity failures
        # (e.g. IPv6 ENETUNREACH / ETIMEDOUT / ECONNRESET seen intermittently on
        # GitHub-hosted Linux runners — these are network flakes, not code bugs).
        # `shell: bash` is required because the default shell on Windows runners
        # is PowerShell, which can't parse the bash for-loop and fails with
        # "Missing opening '(' after keyword 'for'".
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            rc=$?
            echo "npm ci failed (exit $rc) on attempt $attempt; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Verify command palette shortcut contract
        run: npm run test:run -- src/utils/__tests__/commandPaletteShortcut.test.ts src/utils/__tests__/commandPaletteEvents.test.ts

      - name: Get version from tag
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            const version = context.eventName === 'workflow_dispatch'
              ? '${{ github.event.inputs.version_tag }}'
              : context.ref.replace('refs/tags/', '');
            core.setOutput('VERSION', version);

      - name: Validate tag matches app versions
        shell: bash
        run: |
          TAG_RAW="${{ steps.get_version.outputs.VERSION }}"
          TAG_VERSION="${TAG_RAW#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = \"([^\"]+)\"/\1/')"

          echo "Tag: ${TAG_RAW}"
          echo "Expected semantic version: ${TAG_VERSION}"
          echo "package.json: ${PACKAGE_VERSION}"
          echo "tauri.conf.json: ${TAURI_VERSION}"
          echo "Cargo.toml: ${CARGO_VERSION}"

          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"
          test "${TAURI_VERSION}" = "${TAG_VERSION}"
          test "${CARGO_VERSION}" = "${TAG_VERSION}"

      - name: Install create-dmg (macOS only)
        if: matrix.os == 'macos'
        run: brew install create-dmg

      # macOS code signing - Option 1: Ad-hoc signing (no certificate needed)
      - name: Import ad-hoc signing (macOS)
        if: matrix.os == 'macos'
        run: |
          echo "TAURI_SIGNING_IDENTITY=-" >> $GITHUB_ENV
          echo "APPLE_SIGNING_IDENTITY=-" >> $GITHUB_ENV

      # macOS code signing - Option 2: Proper signing (uncomment if you have certificates)
      # To use this, add these secrets to your GitHub repository:
      # - APPLE_CERTIFICATE: Base64 encoded .p12 certificate
      # - APPLE_CERTIFICATE_PASSWORD: Certificate password
      # - APPLE_ID: Your Apple ID email
      # - APPLE_PASSWORD: App-specific password for Apple ID
      # - APPLE_TEAM_ID: Your Apple Developer Team ID
      #
      # - name: Import certificate (macOS)
      #   if: matrix.platform == 'macos-latest'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     # Create variables
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
      #
      #     # Import certificate from secrets
      #     echo -n "$APPLE_CERTIFICATE" | base64 --decode --output $CERTIFICATE_PATH
      #
      #     # Set signing identity
      #     SECURITY_ID=$(security find-identity -v -p codesigning | head -1 | awk '{print $1}' | tr -d '()"')
      #     echo "TAURI_SIGNING_IDENTITY=$SECURITY_ID" >> $GITHUB_ENV
      #     echo "APPLE_SIGNING_IDENTITY=$SECURITY_ID" >> $GITHUB_ENV
      #
      #     # Enable keychain access for GitHub Actions
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" login.keychain-db || true

      - name: Build frontend
        run: npm run build

      - name: Build sidecar binaries (if missing)
        run: node scripts/download-sidecars.js

      # Files extracted from downloaded tarballs can carry the Mark-of-the-Web
      # (Zone.Identifier ADS), which makes Defender on newer runner images
      # treat the sidecar runtime DLLs as untrusted downloads. Strip it before
      # the bundler reads the files so nothing disappears between provisioning
      # and makensis.
      - name: Strip Mark-of-the-Web from sidecar files
        if: matrix.os == 'windows'
        shell: pwsh
        run: Get-ChildItem -Path src-tauri/bin -Recurse -File -ErrorAction SilentlyContinue | Unblock-File

      - name: Install Windows App SDK (Phi Silica bridge)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          nuget install Microsoft.WindowsAppSDK -OutputDirectory $env:USERPROFILE\.nuget\packages -ExcludeVersion
          echo "WINDOWS_APP_SDK_ROOT=$env:USERPROFILE\.nuget\packages\Microsoft.WindowsAppSDK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows sparse identity package
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/build-windows-sparse-package.ps1

      - name: Build Tauri application
        run: npx tauri build ${{ matrix.tauri_args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NOTEBOOKLM_BUNDLE_RUNTIME: "1"
          POCKET_TTS_BUNDLE_RUNTIME: "1"
          LIBSQLITE3_SYS_USE_PKG_CONFIG: ${{ matrix.os == 'linux' && '1' || '0' }}
          SQLITE3_STATIC: ${{ matrix.os == 'linux' && '0' || '1' }}
          CARGO_BUILD_JOBS: ${{ matrix.id == 'linux-x86_64' && '2' || (matrix.id == 'linux-aarch64' && '3' || (matrix.id == 'windows-x86_64' && '2' || (matrix.id == 'macos-aarch64' && '3' || ''))) }}
          # Fallback must be a valid integer: an empty CARGO_PROFILE_* env var
          # makes cargo abort with "cannot parse integer from empty string".
          # 16 is cargo's default release codegen-units (no-op when unset).
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.os == 'linux' && '4' || '16' }}
          VCPKGRS_DYNAMIC: ${{ matrix.os == 'windows' && '0' || '' }}
          SQLX_OFFLINE: "true"
          # macOS ad-hoc codesigning (no Developer ID yet). Separate from the
          # updater signing key below.
          TAURI_SIGNING_IDENTITY: "-"
          APPLE_SIGNING_IDENTITY: "-"
          # Updater artifact signing. With `createUpdaterArtifacts: true` in
          # tauri.conf.json, Tauri emits .sig files alongside each bundle and
          # the macOS .app.tar.gz / Windows .nsis.zip updater archives. The
          # public half of this keypair is committed in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List Windows bundles (debug)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          echo "=== Debug: Listing Windows bundle files ==="
          find src-tauri/target/release/bundle -type f || echo "Bundle dir missing"
          echo "=== src-tauri/bin DLLs ==="
          ls -la src-tauri/bin/*.dll 2>/dev/null || echo "no dlls"
          echo "=== installer.nsi onnxruntime/resource File lines ==="
          grep -n "onnxruntime" src-tauri/target/release/nsis/*/installer.nsi 2>/dev/null || echo "installer.nsi not found or no match"
          echo "=== 7z listing of NSIS archive (bin/) ==="
          SETUP_EXE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -1)
          if [ -n "$SETUP_EXE" ]; then
            "/c/Program Files/7-Zip/7z.exe" l "$SETUP_EXE" | grep -E "bin/|onnxruntime" || echo "no bin/ entries in archive"
          fi

      - name: Verify Windows bundles include NotebookLM runtime
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          ./scripts/verify-windows-bundles.ps1

      - name: Build Windows MSIX package (optional Store path)
        if: matrix.os == 'windows'
        # Store-only extra artifact — neither the installer nor the updater
        # chain consumes it, and this leg takes hours to reach this step, so a
        # Store-pack failure must not fail the release.
        continue-on-error: true
        shell: pwsh
        run: |
          $stage = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Directory | Select-Object -First 1
          if ($stage) {
            ./scripts/build-windows-msix-package.ps1 -StageDir $stage.FullName
          } else {
            Write-Warning "NSIS staging directory not found; skipping MSIX pack"
          }

      # When verification fails, keep the built installer as a workflow
      # artifact so the packing can be dissected offline without rebuilding.
      - name: Upload Windows installer for inspection (on failure)
        if: matrix.os == 'windows' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-failed
          path: src-tauri/target/release/bundle/nsis/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify macOS bundles include NotebookLM runtime
        if: matrix.os == 'macos'
        shell: bash
        run: |
          chmod +x scripts/verify-macos-bundles.sh
          scripts/verify-macos-bundles.sh

      - name: Verify Linux deb bundles include NotebookLM runtime
        if: matrix.os == 'linux'
        shell: bash
        run: |
          chmod +x scripts/verify-deb-bundle.sh
          scripts/verify-deb-bundle.sh

      - name: Upload Windows bundles
        if: matrix.os == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.zip
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.zip
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.msi.sig
            src-tauri/windows/msix/out/*.msix
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS bundles
        if: matrix.os == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux bundles
        if: matrix.os == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add per-architecture summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release target \`${{ matrix.id }}\`"
            echo "- Required: \`${{ matrix.required }}\`"
            echo "- Runner: \`${{ matrix.platform }}\`"
            echo "- Architecture: \`${{ matrix.arch }}\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  release-appimage:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ubuntu-latest
    # See the `release` job: bundle-runtime flags must be visible to the
    # `prebuild` hook and sidecar step too, not just the Tauri build step.
    env:
      NOTEBOOKLM_BUNDLE_RUNTIME: "1"
      POCKET_TTS_BUNDLE_RUNTIME: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Dispatch builds default to the tag itself; build_ref lets a fix
          # that landed after the tag be built into the same release.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_ref || inputs.version_tag) || github.ref }}
          submodules: recursive

      - name: Free disk space
        # The AppImage release build (Rust release profile + appimagetool) is
        # disk-heavy and has tipped ubuntu-latest runners over the edge with
        # "No space left on device" mid-compile. Remove ~10–15 GB of preinstalled
        # toolchains/docs we don't use to give the build room.
        shell: bash
        run: |
          echo "Disk usage before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/conda /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          echo "Disk usage after:"
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Increase Rust stack size
        run: echo "RUST_MIN_STACK=33554432" >> $GITHUB_ENV

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        # Retry npm ci to ride out transient npm-registry connectivity failures
        # (e.g. IPv6 ENETUNREACH / ETIMEDOUT / ECONNRESET seen intermittently on
        # GitHub-hosted Linux runners — these are network flakes, not code bugs).
        # `shell: bash` is required because the default shell on Windows runners
        # is PowerShell, which can't parse the bash for-loop and fails with
        # "Missing opening '(' after keyword 'for'".
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            rc=$?
            echo "npm ci failed (exit $rc) on attempt $attempt; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Verify command palette shortcut contract
        run: npm run test:run -- src/utils/__tests__/commandPaletteShortcut.test.ts src/utils/__tests__/commandPaletteEvents.test.ts

      - name: Get version from tag
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            const version = context.eventName === 'workflow_dispatch'
              ? '${{ github.event.inputs.version_tag }}'
              : context.ref.replace('refs/tags/', '');
            core.setOutput('VERSION', version);

      - name: Validate tag matches app versions
        shell: bash
        run: |
          TAG_RAW="${{ steps.get_version.outputs.VERSION }}"
          TAG_VERSION="${TAG_RAW#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = \"([^\"]+)\"/\1/')"

          echo "Tag: ${TAG_RAW}"
          echo "Expected semantic version: ${TAG_VERSION}"
          echo "package.json: ${PACKAGE_VERSION}"
          echo "tauri.conf.json: ${TAURI_VERSION}"
          echo "Cargo.toml: ${CARGO_VERSION}"

          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"
          test "${TAURI_VERSION}" = "${TAG_VERSION}"
          test "${CARGO_VERSION}" = "${TAG_VERSION}"

      - name: Build frontend
        run: npm run build

      - name: Build sidecar binaries (if missing)
        run: node scripts/download-sidecars.js

      - name: Build Tauri AppImage (with fallback repack)
        run: |
          scripts/ci-build-appimage.sh
        env:
          TAURI_BUNDLE_APPIMAGE: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NOTEBOOKLM_BUNDLE_RUNTIME: "1"
          POCKET_TTS_BUNDLE_RUNTIME: "1"

      # ci-build-appimage.sh repacks the AppImage after Tauri builds it
      # (to inject the notebooklm runtime + GStreamer plugins), so the .sig
      # Tauri produced during `tauri build` is for the pre-repack artifact
      # and no longer matches. Re-sign the final AppImage here so the
      # updater verifies the exact bytes the user downloads.
      - name: Sign repacked AppImage for updater
        run: |
          VERSION_NO_V="${{ steps.get_version.outputs.VERSION }}"
          VERSION_NO_V="${VERSION_NO_V#v}"
          npx @tauri-apps/cli signer sign \
            "src-tauri/target/release/bundle/appimage/Plethora_${VERSION_NO_V}_amd64.AppImage"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # v2.6.1 shipped an AppImage whose uploaded bytes did not match the
      # signature produced by the step above (v2.6.0 verified with identical
      # pipeline code — an undetected release flake that broke in-place
      # updates for every Linux AppImage user). Re-verify the signature
      # against the on-disk artifact with the updater's public key BEFORE
      # anything is uploaded, so a bad sign fails the job here.
      - name: Verify AppImage updater signature
        run: |
          VERSION_NO_V="${{ steps.get_version.outputs.VERSION }}"
          VERSION_NO_V="${VERSION_NO_V#v}"
          node scripts/verify-update-artifact.mjs \
            --pubkey-config src-tauri/tauri.conf.json \
            --artifact "src-tauri/target/release/bundle/appimage/Plethora_${VERSION_NO_V}_amd64.AppImage" \
            --sig "src-tauri/target/release/bundle/appimage/Plethora_${VERSION_NO_V}_amd64.AppImage.sig"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-arch:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git for checkout
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref }}
          submodules: recursive

      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm
          # cmake is required to build whisper.cpp from source via download-sidecars.js
          # (triggered by the prebuild hook during `tauri build`). Without it the job
          # dies with "cmake: command not found". The sidecar binaries are gitignored,
          # so every Arch release build compiles whisper.cpp itself.
          pacman -S --noconfirm base-devel cmake webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg patchelf npm nodejs rust cargo clang lld sqlite pipewire

      - name: Install frontend dependencies
        # Retry npm ci to ride out transient npm-registry connectivity failures
        # (e.g. IPv6 ENETUNREACH / ETIMEDOUT / ECONNRESET seen intermittently on
        # GitHub-hosted Linux runners — these are network flakes, not code bugs).
        # `shell: bash` is required because the default shell on Windows runners
        # is PowerShell, which can't parse the bash for-loop and fails with
        # "Missing opening '(' after keyword 'for'".
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then
              echo "npm ci succeeded on attempt $attempt"
              exit 0
            fi
            rc=$?
            echo "npm ci failed (exit $rc) on attempt $attempt; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Verify command palette shortcut contract
        run: npm run test:run -- src/utils/__tests__/commandPaletteShortcut.test.ts src/utils/__tests__/commandPaletteEvents.test.ts

      - name: Get version from tag
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            const version = context.eventName === 'workflow_dispatch'
              ? '${{ github.event.inputs.version_tag }}'
              : context.ref.replace('refs/tags/', '');
            core.setOutput('VERSION', version);

      - name: Validate tag matches app versions
        shell: bash
        run: |
          TAG_RAW="${{ steps.get_version.outputs.VERSION }}"
          TAG_VERSION="${TAG_RAW#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = \"([^\"]+)\"/\1/')"

          echo "Tag: ${TAG_RAW}"
          echo "Expected semantic version: ${TAG_VERSION}"
          echo "package.json: ${PACKAGE_VERSION}"
          echo "tauri.conf.json: ${TAURI_VERSION}"
          echo "Cargo.toml: ${CARGO_VERSION}"

          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"
          test "${TAURI_VERSION}" = "${TAG_VERSION}"
          test "${CARGO_VERSION}" = "${TAG_VERSION}"

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application
        run: npx tauri build --no-bundle
        env:
          RUST_MIN_STACK: 33554432
          LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
          SQLITE3_STATIC: "0"
          ZSTD_SYS_USE_PKG_CONFIG: "1"
          RUSTFLAGS: -C link-arg=-lsqlite3 -C link-arg=-lzstd
          # The container has the same RAM as a VM runner but the final
          # plethora-tauri lib (ThinLTO over the whole dep graph) peaks near
          # the memory ceiling while cargo is still compiling other crates in
          # parallel; rustc got SIGKILLed (OOM) mid-crate in the v3.0.0 run.
          # Cap build parallelism so the big crate compiles with headroom.
          CARGO_BUILD_JOBS: "2"

      - name: Create Pacman package
        run: |
          PKG_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | awk -F'"' '{print $2}')

          mkdir -p arch-pkg

          # Copy built artifacts for the PKGBUILD to install
          cp src-tauri/target/release/plethora-tauri arch-pkg/plethora-tauri
          cp src-tauri/icons/128x128.png arch-pkg/128x128.png

          # Generate the XDG desktop entry inline. It is not tracked in the
          # repo (Tauri generates it during bundling, but this job uses
          # --no-bundle), so create it here from the app metadata. The previous
          # `cp src-tauri/incrementum.desktop ... || true` silently no-op'd
          # because that file never existed, causing makepkg to fail later at
          # the source=() validation with "incrementum.desktop was not found".
          # printf avoids heredoc-indentation pitfalls under the YAML block scalar.
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Plethora' \
            'Comment=Spaced repetition and incremental reading for effective learning' \
            'Exec=plethora %U' \
            'Icon=plethora' \
            'Terminal=false' \
            'Categories=Education;' \
            'StartupWMClass=Plethora' \
            > arch-pkg/plethora.desktop

          # Create PKGBUILD — binary is already built with embedded frontend assets
          cat > arch-pkg/PKGBUILD << EOF
          pkgname=plethora
          pkgver=${PKG_VERSION}
          pkgrel=1
          pkgdesc="Plethora - Spaced repetition and incremental reading for effective learning"
          arch=('x86_64')
          url="https://github.com/melpomenex/Plethora"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'libappindicator-gtk3' 'librsvg' 'gcc-libs' 'glibc' 'zstd')
          optdepends=('notebooklm-py: NotebookLM integration for AI-powered flashcard generation'
                      'python-notebooklm: Alternative NotebookLM package')
          source=("plethora-tauri" "128x128.png" "plethora.desktop")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
            install -Dm755 "\$srcdir/plethora-tauri" "\$pkgdir/usr/bin/plethora"
            install -Dm644 "\$srcdir/128x128.png" "\$pkgdir/usr/share/icons/hicolor/128x128/apps/plethora.png"
            install -Dm644 "\$srcdir/plethora.desktop" "\$pkgdir/usr/share/applications/plethora.desktop"
          }
          EOF

          # Build the package
          cd arch-pkg
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE/arch-pkg"
          su builder -c "cd $GITHUB_WORKSPACE/arch-pkg && makepkg --noconfirm --nosign"

      - name: Upload Pacman to release
        uses: softprops/action-gh-release@v2
        with:
          files: arch-pkg/*.pkg.tar.zst
          draft: false
          prerelease: false
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-readiness:
    needs: [release, release-appimage, release-arch, verify-release]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required and optional release outcomes
        run: |
          {
            echo "## Release readiness"
            echo "- release matrix: \`${{ needs.release.result }}\`"
            echo "- release-appimage: \`${{ needs.release-appimage.result }}\`"
            echo "- release-arch: \`${{ needs.release-arch.result }}\`"
            echo "- verify-release (published update chain): \`${{ needs.verify-release.result }}\`"
            echo ""
            echo "Required: \`macos-aarch64\`, \`release-appimage\`, \`release-arch\`, \`verify-release\`"
            echo "Optional: \`windows-x86_64\` (its updater artifacts are enforced by create-update-manifest + verify-release)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required architecture gate
        run: |
          test "${{ needs.release.result }}" = "success"
          test "${{ needs.release-appimage.result }}" = "success"
          test "${{ needs.release-arch.result }}" = "success"
          test "${{ needs.verify-release.result }}" = "success"

  create-update-manifest:
    # Intentionally decoupled from release-readiness. The manifest only
    # references the macOS .app.tar.gz, the Linux AppImage, and the Windows
    # setup exe — not the deb or the Arch pacman package. release-readiness
    # hard-fails whenever ANY required build fails, so chaining the manifest
    # off it meant a transient flake in the deb/arch build (which the updater
    # never consumes) silently skipped latest.json and broke auto-update for
    # every platform. Instead we run whenever the workflow isn't cancelled and
    # let the manifest script itself enforce that the artifacts it references
    # are present and signed (see the required-signature guard below).
    # windows_only backfills skip it: latest.json on the existing release
    # stays byte-identical so already-shipped updaters are untouched.
    needs: [release, release-appimage]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Dispatch builds default to the tag itself; build_ref lets a fix
          # that landed after the tag be built into the same release.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_ref || inputs.version_tag) || github.ref }}
          submodules: recursive

      - name: Create update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const tag = context.eventName === 'workflow_dispatch'
              ? '${{ github.event.inputs.version_tag }}'
              : context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = `https://github.com/${owner}/${repo}/releases/download/${tag}`;

            // Map each updater platform key to the asset name produced by the
            // platform jobs. Recognized keys per the Tauri updater are
            // darwin-aarch64 / darwin-x86_64 / linux-x86_64 / windows-x86_64.
            //
            // IMPORTANT naming differences across bundle types:
            //  - macOS updater artifact is `Plethora.app.tar.gz` — NO version
            //    and NO arch suffix (Tauri's macOS updater naming is simpler
            //    than Windows/Linux). Using `<name>_<version>_<arch>.app.tar.gz`
            //    here produces an empty signature + a 404 URL and silently
            //    breaks macOS auto-update.
            //  - Only darwin-aarch64 is built (the matrix has no x64 macOS job),
            //    so darwin-x86_64 is intentionally omitted. Emitting it would
            //    point at a nonexistent artifact.
            //  - The AppImage is re-signed after its repack (see release-appimage
            //    job), so its .sig matches the final uploaded bytes.
            //
            // `required` marks platforms we refuse to ship the manifest
            // without. In-place updates are a product requirement on all
            // three desktop platforms: windows was previously optional and
            // silently omitted, which let the Windows build rot unnoticed
            // from v2.4.0 to v2.6.1 (no -setup.exe assets, no manifest
            // entry, no self-update). A missing Windows artifact now fails
            // this job loudly; the release matrix leg stays
            // continue-on-error so the macOS/Linux assets still upload for
            // existing users, and the failure surfaces here + in
            // release-readiness. Use the `windows_only` dispatch to backfill
            // a release whose Windows leg failed.
            const platforms = {
              'darwin-aarch64':  { asset: `Plethora.app.tar.gz`,            required: true },
              'linux-x86_64':    { asset: `Plethora_${version}_amd64.AppImage`, required: true },
              'windows-x86_64':  { asset: `Plethora_${version}_x64-setup.exe`,  required: true },
            };

            // Locate the release and its assets so we can pull the .sig file
            // contents. The .sig assets were uploaded in the prior stage.
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = release.data.assets;
            const assetByName = new Map(assets.map(a => [a.name, a]));

            const platformsOut = {};
            const missing = [];
            const dropped = [];
            for (const [key, { asset, required }] of Object.entries(platforms)) {
              // The bundle itself must exist, or the manifest would point at a
              // 404 download URL.
              if (!assetByName.has(asset)) {
                (required ? missing : dropped).push(`${key}: ${asset} not found in release assets`);
                continue;
              }
              const sigName = `${asset}.sig`;
              const sigAsset = assetByName.get(sigName);
              let signature = '';
              if (sigAsset) {
                // .sig files are small base64-ish text; download via the API
                // using the browser_download_url to avoid rate limits.
                const res = await fetch(sigAsset.browser_download_url);
                signature = (await res.text()).trim();
              }
              if (!signature) {
                (required ? missing : dropped).push(`${key}: ${sigName} ${sigAsset ? 'was empty' : 'not found in release assets'}`);
                continue;
              }
              platformsOut[key] = {
                signature,
                url: `${base}/${asset}`,
              };
            }

            // A required platform missing its bundle or signature means the
            // manifest would break auto-update on that platform, so hard-fail
            // rather than publish a broken manifest.
            if (missing.length) {
              core.setFailed(`Missing required updater artifacts, refusing to publish latest.json:\n${missing.join('\n')}`);
              return;
            }
            // All platforms are required now; `dropped` stays as a guard in
            // case a platform is ever made optional again.
            if (dropped.length) {
              core.warning(`Omitting non-required platforms from manifest:\n${dropped.join('\n')}`);
            }

            const manifest = {
              version,
              notes: `See https://github.com/${owner}/${repo}/releases/tag/${tag} for release notes.`,
              pub_date: new Date().toISOString(),
              platforms: platformsOut,
            };

            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            core.info('latest.json:\n' + JSON.stringify(manifest, null, 2));

      - name: Upload update manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    # Post-publication gate: verify what clients actually download — the
    # released latest.json, every platform entry it declares, each artifact's
    # signature against the updater public key, and the asset digests against
    # GitHub's API records. This catches what the pre-upload checks cannot
    # see: signer flakes (the v2.6.1 AppImage was signed over bytes that did
    # not match what got uploaded, breaking in-place updates for every Linux
    # AppImage user), upload corruption, and manifest/asset mismatches.
    # Runs even when create-update-manifest failed, so a broken release is
    # diagnosed here too. windows_only backfills skip manifest regeneration,
    # so there is no new chain to verify.
    needs: [create-update-manifest]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Scripts only — no build, so the whisper.cpp submodule isn't needed.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_ref || inputs.version_tag) || github.ref }}

      - name: Verify published update chain
        run: |
          node scripts/verify-release-updates.mjs \
            --repo "${{ github.repository }}" \
            --tag "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-release-notes:
    needs: [create-update-manifest]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref }}

      - name: Extract release notes from changelog
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Failed to extract release notes for ${VERSION} from CHANGELOG.md"
            exit 1
          fi

      - name: Sync GitHub release body from changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
