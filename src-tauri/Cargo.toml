[package]
name = "plethora-tauri"
version = "3.0.0"
description = "Plethora - Incremental Reading and Spaced Repetition"
authors = ["Plethora Team"]
edition = "2021"
default-run = "plethora-tauri"

[lib]
name = "plethora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-winres = "0.1"

[dependencies]
# Pin to 2.11.5 (latest 2.11.x). http://localhost is served via tauri-plugin-localhost
# and is intentionally classified as a remote origin since 2.11.1 (GHSA-7gmj-67g7-phm9
# follow-up). IPC access is scoped via capabilities/default.json `remote.urls` to
# explicit localhost ports only — never arbitrary remote origins.
# https://github.com/tauri-apps/tauri/security/advisories/GHSA-7gmj-67g7-phm9
tauri = { version = "=2.11.5", features = ["unstable", "tray-icon", "macos-private-api", "image-png"] }

# Note: "devtools" feature is intentionally not enabled unconditionally.
# DevTools are opened at runtime via INCREMENTUM_OPEN_DEVTOOLS env var.
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Cross-platform OS media controls (macOS now-playing keys, Windows SMTC,
# Linux MPRIS) for the desktop remote-media bridge. use_zbus keeps MPRIS on
# the pure-Rust zbus stack — no system libdbus needed at build time.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS info plugin — used by the frontend to detect native mobile builds
# (platform() returns "android"/"ios"/"macos"/...) so the mobile UI shell
# renders inside the Android/iOS Tauri webview. Compiles for all targets,
# unlike localhost/battery which are desktop-only.
tauri-plugin-os = "2"

# Logging plugin — routes Rust `log`/`tracing` macros AND frontend JS console
# output to platform-native sinks. On Android the Logcat target is enabled so
# `adb logcat` shows app logs in release builds (essential for diagnosing
# mobile perf/heating without a debug build, which has its own overhead).
# On desktop, targets Stdout + a rotating log file.
tauri-plugin-log = "2"
# Referenced directly for log::LevelFilter in the log-plugin builder config.
log = "0.4"

# In-repo mobile plugin for importing documents from a folder recursively.
# On desktop it opens a native folder dialog + walkdir scan; on Android it uses
# SAF (ACTION_OPEN_DOCUMENT_TREE) and on iOS a UIDocumentPickerViewController in
# folder mode, staging files into app-private storage so the path-based import
# pipeline can read them. See plugins/plethora-folder-import/.
plethora-folder-import = { path = "plugins/plethora-folder-import" }
# In-repo iOS plugin for native StoreKit 2 billing (products, purchase with
# appAccountToken, verified entitlements, restore, transaction updates,
# manage-subscriptions). Non-iOS targets return typed UNSUPPORTED errors.
# See plugins/plethora-storekit/.
plethora-storekit = { path = "plugins/plethora-storekit" }
# In-repo Android plugin for Google Play Billing (subscriptions, purchase flow,
# query/restore, purchase-update events). Non-Android targets return
# platform_unsupported. Server-side acknowledgement is authoritative.
# See plugins/plethora-playbilling/.
plethora-playbilling = { path = "plugins/plethora-playbilling" }
# In-repo mobile plugin for on-device TTS on Android via sherpa-onnx
# (KittenTTS Micro / Kokoro-82M). The Rust side is a thin shim that registers
# the Android plugin; the Kotlin side owns inference, AudioTrack playback, audio
# focus, lifecycle, model downloads, and the System-TTS fallback. No PCM crosses
# the Tauri IPC. On desktop every command returns an Android-only error and
# Pocket TTS is used instead. See plugins/plethora-android-tts/.
plethora-android-tts = { path = "plugins/plethora-android-tts" }
# In-repo Android plugin for on-device generative AI via ML Kit GenAI (Gemini
# Nano through the system AICore service). The Rust side is a thin shim that
# registers the Kotlin plugin; the Kotlin side owns the ML Kit clients, their
# lifetime, and error classification. On every non-Android target the status
# command reports `platform_unsupported` and inference returns a typed error, so
# callers fall back to the configured cloud provider. See plugins/plethora-android-genai/.
plethora-android-genai = { path = "plugins/plethora-android-genai" }
# In-repo Android plugin for on-device speech-to-text of imported audiobooks
# and podcasts via sherpa-onnx (SenseVoice int8 multilingual default, Parakeet
# TDT_CTC 110M int8 English fast path). Kotlin owns the MediaCodec decode →
# resample → silero VAD → OfflineRecognizer pipeline inside a foreground
# service; only control messages and finished timed segments cross the IPC.
# Non-Android commands return `platform_unsupported` (Groq path untouched).
# See plugins/plethora-android-stt/.
plethora-android-stt = { path = "plugins/plethora-android-stt" }
plethora-android-speech = { path = "plugins/plethora-android-speech" }
plethora-android-vision = { path = "plugins/plethora-android-vision" }
plethora-android-nlp = { path = "plugins/plethora-android-nlp" }
plethora-android-search = { path = "plugins/plethora-android-search" }
# Apple on-device intelligence (Foundation Models, Speech, Vision, Spotlight,
# NaturalLanguage, Core AI). Non-Apple targets return platform_unsupported.
# See plugins/plethora-apple-intelligence/.
plethora-apple-intelligence = { path = "plugins/plethora-apple-intelligence" }
# Windows on-device intelligence (Phi Silica / Windows AI APIs). Non-Windows
# targets return platform_unsupported. See plugins/plethora-windows-intelligence/.
plethora-windows-intelligence = { path = "plugins/plethora-windows-intelligence" }
window-vibrancy = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "derive"], default-features = false }
libsqlite3-sys = { version = "0.28", features = ["bundled", "bundled-windows"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# System-info detection (CPU cores, RAM, disk, GPU) for the HF speech-model
# suitability analysis. Already in the dependency graph via burn-train; pinned
# to the same 0.33 line already resolved in Cargo.lock.
sysinfo = "0.33"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Base64 encoding
base64 = "0.22"

# Runtime dynamic loading of the bundled sherpa-onnx C API (desktop TTS)
libloading = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
# The `log` feature bridges tracing events into the `log` facade, so they reach
# tauri-plugin-log's global logger (and thus Logcat on Android / stdout + log
# file on desktop). Without it, the app's 100+ tracing::warn!/info!/error!
# calls would be invisible to the log plugin.
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"

# Async
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "stream", "multipart", "gzip", "rustls-tls"] }
pulldown-cmark = "0.11"
# rustls crypto provider. reqwest 0.12's `rustls-tls` resolves to the
# `*-no-provider` variant, which means rustls 0.23 is compiled WITHOUT an
# auto-installed crypto provider. On Android this panics at runtime:
#   "No rustls crypto provider is configured. When using the
#    `rustls-no-provider` feature you must install a crypto provider before
#    building a Client..."
# We pull in rustls with the `ring` provider (the backend reqwest selects via
# `__rustls-ring`) and install it as the default at startup — see run() in
# lib.rs. `aws_lc_rs` does not build for android/ios in this toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
lazy_static = "1.4"
url = "2.5"
urlencoding = "2.1"
rand = "0.8"
once_cell = "1.19"

# Encryption
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hostname = "0.4"
# gzip for article-import raw-source snapshots (source-snapshots/*.html.gz)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Vector search and embeddings
byteorder = "1.5"

# WebSocket
tokio-tungstenite = "0.23"
futures-util = "0.3"

# HTTP server for browser extension
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }

# File processing
lopdf = { version = "0.34", features = ["tokio"] }
pdf-extract = "0.10"
epub = "2"
# Pure-Rust audio metadata: reads embedded cover art (MP4 covr / ID3 APIC /
# FLAC METADATA_BLOCK_PICTURE / Vorbis Comments) without shelling out to ffmpeg,
# so audiobook cover extraction works on Android where no ffmpeg sidecar exists.
lofty = "0.24"
walkdir = "2"
regex = "1"
zip = "0.6"
quick-xml = "0.37"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
image = "0.24"
tempfile = "3"

# RSS parsing
roxmltree = "0.20"
md5 = "0.7"

# HTML content extraction for full article reading
readable-readability = "0.4"
html2text = "0.13"

# Spaced Repetition
fsrs = { path = "../vendor/fsrs-rs-fsrs7" }

# Environment variables
dotenvy = "0.15"

# Config directories
dirs = "5.0"

# OS keychain for OAuth token persistence
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Encrypted fallback key derivation
pbkdf2 = "0.12"

# Desktop-only dependencies.
# The crates below have no Android/iOS backend and fail to compile for those
# targets, so they are scoped to desktop via a target-specific table:
#   - `battery` 0.7: emits "Support for this target OS is not implemented yet!"
#     on android/ios.
#   - `xcap` 0.8: its `platform` module is empty on iOS/Android, so compiling it
#     fails with "could not find `platform` in the crate root".
# On mobile the corresponding Tauri commands are stubbed out (see src/battery.rs
# and src/screenshot.rs), and the `screenshot` cargo feature is a no-op there
# because `xcap` is absent from the dependency graph on those targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Must register before other plugins. Forwards argv from second instances to the
# running process (see src/external_open.rs).
tauri-plugin-single-instance = "2"
battery = "0.7"
xcap = { version = "0.8", optional = true }
# Desktop-only: tauri-plugin-localhost serves the frontend over
# http://localhost:<port> so YouTube iframe embeds work (the `tauri://`
# custom protocol is treated as a remote origin and blocks iframes). On
# android/ios the mobile WebView cannot reach the loopback server, so the app
# shows "localhost:9527 could not be loaded". Mobile uses the bundled
# frontendDist via tauri:// instead (see the `custom-protocol-mobile` feature).
tauri-plugin-localhost = "2"
# Desktop-only: persists window size/position/maximized state to disk and
# restores it on next launch, so the app reopens where the user left it.
# Mobile platforms don't have freely positionable windows, so it's gated to
# desktop targets.
tauri-plugin-window-state = "2"

# Already linked transitively via tao on macOS; declared directly so setup can
# set the Dock icon for unbundled (tauri dev) runs, where macOS never applies
# the .app bundle's icns.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[features]
# Disable custom-protocol to use http://localhost instead of tauri://
# This allows YouTube iframe embeds to work properly without Error 153
default = ["screenshot"]
custom-protocol = ["tauri/custom-protocol"]
screenshot = ["xcap"]
devtools = ["tauri/devtools"]

# Aggressive release optimization for battery efficiency.
# NOTE: Some environments have observed rustc/LLVM crashes (SIGSEGV) with high
# optimization on large dependency graphs. If this happens, temporarily fall
# back to opt-level = "z", lto = "thin", codegen-units = 4.
#
# panic = "unwind" (the default) is REQUIRED: third-party PDF font parsers
# (cff-parser via pdf-extract) panic on exotic font encodings, and the
# import pipeline relies on catching those panics at the spawn_blocking
# JoinError to degrade to metadata-only import. With abort, one such PDF
# killed the whole app on Android (verified crash log, 2026-08-15).
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 4
strip = true

# Ensure third-party crates also get full optimization
[profile.release.package."*"]
opt-level = 3

# Fast local Linux package iteration — NOT for production releases.
# Invoked only via npm run tauri:build:linux:deb:fast (or explicit --profile).
[profile.package-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
strip = true

[profile.package-fast.package."*"]
opt-level = 2

# NOTE: In some environments we've observed rustc/LLVM crashing (SIGSEGV) when
# compiling large dependency graphs with full debuginfo/incremental enabled.
# Disabling both improves build stability for `tauri dev`.
[profile.dev]
debug = 0
incremental = false
# Tauri embeds the full ACL manifest in debug_assertions builds; with 700+ app
# commands that blows the 8MiB context-creation stack (tauri-apps/tauri#9882).
debug-assertions = false

[dev-dependencies]
filetime = "0.2"
tower05 = { package = "tower", version = "0.5", features = ["util"] }
# tauri's `test` feature exposes mock_app/mock_builder for the ignored
# live GPU-runtime provisioning test (run explicitly with --ignored).
tauri = { version = "=2.11.5", features = ["test"] }

[patch.crates-io]
burn-ndarray = { path = "../vendor/burn-ndarray-0.17.1" }
macerator = { path = "../vendor/macerator-0.2.10" }
systemstat = { git = "https://github.com/melpomenex/systemstat", branch = "fix-android-procfs" }
# Local workaround for https://github.com/tauri-apps/wry/issues/1775:
# WKURLSchemeTask did* calls from non-main threads synchronously wait on the
# main run loop (callOnMainRunLoopAndWait); combined with tauri's
# safe_block_on dev-server proxy this deadlocks the tokio worker pool and
# freezes iOS simulator boots mid-module-waterfall. The patch dispatches the
# did* sequence onto the GCD main queue asynchronously instead.
wry = { path = "../vendor/wry-0.55.1" }
# Plethora has 700+ app command ACL entries; Tauri's default 8MiB context thread
# overflows during permission expansion (tauri-apps/tauri#9882).
tauri-codegen = { path = "../vendor/tauri-codegen-2.6.3" }
