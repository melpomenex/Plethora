# Static (non-autogenerated) permission for the Swift base-class listener
# registration commands. The transaction-update event channel is registered by
# the frontend directly against the native plugin
# (`plugin:plethora-storekit|registerListener`), so these commands must be
# allowed even though they are not part of the Rust command surface.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-register-listener"
description = "Allows registering native plugin event listeners (transaction updates)."
commands.allow = ["registerListener"]

[[permission]]
identifier = "allow-remove-listener"
description = "Allows removing native plugin event listeners."
commands.allow = ["removeListener"]
