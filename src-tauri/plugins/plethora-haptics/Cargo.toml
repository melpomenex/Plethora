[package]
name = "plethora-haptics"
version = "0.1.0"
description = "Tauri plugin for semantic mobile haptic feedback"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-haptics"

[build-dependencies]
tauri-plugin = { version = "=2.6.3", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["unstable"] }
