[package]
name = "plethora-windows-intelligence"
version = "0.1.0"
description = "Tauri plugin for Windows on-device intelligence (Phi Silica / Windows AI APIs)"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-windows-intelligence"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.0", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_SystemInformation",
] }
