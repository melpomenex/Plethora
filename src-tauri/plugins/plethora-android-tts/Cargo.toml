[package]
name = "plethora-android-tts"
version = "0.1.0"
description = "Tauri plugin for on-device TTS on Android via sherpa-onnx (KittenTTS / Kokoro-82M)"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-android-tts"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = "1"
serde_json = "1"
thiserror = "1"
