[package]
name = "plethora-android-speech"
version = "0.1.0"
description = "ML Kit Speech Recognition (alpha) — persist-audio-first"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-android-speech"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = "1"
serde_json = "1"
thiserror = "1"
