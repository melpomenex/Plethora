"$schema" = "schemas/schema.json"

[default]
description = """
ML Kit Speech Recognition (alpha) — persist-audio-first
"""
permissions = [
  "allow-speech-status",
  "allow-dictation-status",
  "allow-start-dictation",
  "allow-stop-dictation",
  "allow-cancel-dictation",

  "allow-transcribe-audio",
  "allow-download-speech-model",

  "allow-recording-status",
  "allow-start-recording",
  "allow-pause-recording",
  "allow-resume-recording",
  "allow-finish-recording"
]
