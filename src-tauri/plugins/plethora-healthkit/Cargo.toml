[package]
name = "plethora-healthkit"
version = "0.1.0"
description = "Tauri plugin for native iOS Apple HealthKit read authorization, anchored sleep/biometric queries, background delivery, and iCloud backup exclusion"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-healthkit"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
