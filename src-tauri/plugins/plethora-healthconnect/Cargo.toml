[package]
name = "plethora-healthconnect"
version = "0.1.0"
description = "Tauri plugin for native Android Health Connect sleep, heart rate, HRV, activity, history/background permissions, and incremental changes"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-healthconnect"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
