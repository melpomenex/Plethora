[package]
name = "plethora-android-search"
version = "0.1.0"
description = "Optional AppSearch derived index; SQLite remains source of truth"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-android-search"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.0", features = ["unstable"] }
serde = "1"
serde_json = "1"
thiserror = "1"
