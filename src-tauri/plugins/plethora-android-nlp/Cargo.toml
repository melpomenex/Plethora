[package]
name = "plethora-android-nlp"
version = "0.1.0"
description = "ML Kit Language ID + Translate (local)"
authors = ["Plethora Team"]
edition = "2021"
links = "plethora-android-nlp"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = "1"
serde_json = "1"
thiserror = "1"
