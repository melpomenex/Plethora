<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarly reader visual harness</title>
    <style>
      html, body, #scholarly-reader-shell { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #0b0f18; }
      #scholarly-reader-frame { display: block; width: 100%; height: 100%; border: 0; }
      #scholarly-reader-status { position: fixed; inset: 0; display: grid; place-items: center; color: white; font: 14px system-ui; }
      [data-ready="true"] #scholarly-reader-status { display: none; }
    </style>
  </head>
  <body>
    <main id="scholarly-reader-shell" data-ready="false">
      <div id="scholarly-reader-status">Preparing deterministic scholarly fixture…</div>
      <iframe id="scholarly-reader-frame" title="Canonical scholarly article" sandbox="allow-same-origin"></iframe>
    </main>
    <script type="module" src="/src/visual/scholarlyReaderHarness.ts"></script>
  </body>
</html>
