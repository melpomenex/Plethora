<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
  <title id="title">Mixture of experts routing</title>
  <desc id="description">Tokens flow through a router into three expert blocks.</desc>
  <rect width="800" height="360" fill="#eef3f7"/>
  <g fill="none" stroke="#32506f" stroke-width="8">
    <path d="M120 180H300"/>
    <path d="M420 180L590 80"/>
    <path d="M420 180H590"/>
    <path d="M420 180L590 280"/>
  </g>
  <g fill="#fff" stroke="#32506f" stroke-width="5">
    <rect x="40" y="130" width="140" height="100" rx="12"/>
    <rect x="300" y="125" width="120" height="110" rx="55"/>
    <rect x="590" y="30" width="170" height="90" rx="12"/>
    <rect x="590" y="135" width="170" height="90" rx="12"/>
    <rect x="590" y="240" width="170" height="90" rx="12"/>
  </g>
  <g fill="#1c3045" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">
    <text x="110" y="188">Tokens</text>
    <text x="360" y="188">Router</text>
    <text x="675" y="85">Expert A</text>
    <text x="675" y="190">Expert B</text>
    <text x="675" y="295">Expert C</text>
  </g>
</svg>
